<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitalis — Onboarding Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15140F; --paper:#F3F0E8; --paper2:#EAE6D9; --accent:#42544A;
  --line:#D9D4C6; --muted:#6E6A5E; --white:#FCFBF8; --err:#8C3B2E;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#F3F0E8; --paper:#15140F; --paper2:#1D1B14; --line:#33312A; --muted:#8B876F; --white:#1D1B14; --accent:#8FAE9C; }
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
.app{height:100dvh;display:flex;flex-direction:column;position:relative;}
.progress-track{position:fixed;top:0;left:0;right:0;height:2px;background:var(--line);z-index:50;
  padding-top:env(safe-area-inset-top,0px);}
.progress-fill{height:2px;background:var(--ink);width:0%;transition:width .5s cubic-bezier(.65,0,.35,1);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:28px 28px 0;
  padding-top:calc(28px + env(safe-area-inset-top,0px));}
.back-btn{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;
  display:flex;align-items:center;gap:6px;padding:8px;margin:-8px;border-radius:2px;transition:color .2s;}
.back-btn:hover{color:var(--ink);}
.back-btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
.back-btn.hidden{visibility:hidden;}
.step-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em;}
.stage{flex:1;overflow-y:auto;display:flex;justify-content:center;padding:40px 28px 140px;}
.stage-inner{width:100%;max-width:620px;}
.q-eyebrow{font-size:13px;color:var(--accent);margin-bottom:14px;font-weight:500;}
.q-title{font-family:var(--serif);font-weight:400;font-size:clamp(28px,5vw,40px);line-height:1.15;
  letter-spacing:-.01em;margin-bottom:14px;}
.q-sub{color:var(--muted);font-size:16px;line-height:1.6;max-width:52ch;margin-bottom:36px;}
.q-optional{display:block;font-size:13px;color:var(--muted);font-weight:500;margin:0 0 32px;}
.q-title.has-optional{margin-bottom:12px;}
.field-label{font-size:13px;color:var(--muted);margin-bottom:8px;display:block;}
.grid-select{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
.grid-select.single-col{grid-template-columns:1fr;}
.tile{border:1px solid var(--line);background:var(--white);padding:18px 20px;text-align:left;
  cursor:pointer;font-size:15px;color:var(--ink);transition:border-color .2s,background .2s;border-radius:2px;line-height:1.4;}
.tile:hover{border-color:var(--muted);}
.tile.selected{border-color:var(--ink);background:var(--paper2);}
.tile .tick{float:right;opacity:0;transition:opacity .15s;color:var(--accent);}
.tile.selected .tick{opacity:1;}
.yn-row{display:flex;gap:10px;}
.yn-row .tile{flex:1;text-align:center;}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],textarea{
  width:100%;border:none;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);
  font-family:var(--sans);font-size:17px;padding:10px 2px;transition:border-color .2s;
}
textarea{resize:vertical;min-height:90px;font-size:16px;line-height:1.5;}
input:focus,textarea:focus{border-color:var(--ink);outline:none;}
.field-row{margin-bottom:26px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.rating-group{display:flex;flex-direction:column;gap:22px;margin-bottom:8px;}
.rating-item .rlabel{display:flex;justify-content:space-between;font-size:15px;margin-bottom:10px;}
.rating-item .rlabel .rval{color:var(--muted);font-size:13px;}
.dots{display:flex;gap:6px;}
.dot{flex:1;height:14px;border:1px solid var(--line);background:transparent;cursor:pointer;border-radius:1px;transition:background .15s,border-color .15s;}
.dot.on{background:var(--ink);border-color:var(--ink);}
.slider-wrap{margin:30px 0;}
.slider-value{font-family:var(--serif);font-size:52px;margin-bottom:18px;}
.slider-value .unit{font-family:var(--sans);font-size:16px;color:var(--muted);margin-left:8px;}
input[type=range]{-webkit-appearance:none;width:100%;height:2px;background:var(--line);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--ink);cursor:pointer;border:3px solid var(--paper);box-shadow:0 0 0 1px var(--ink);}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ink);cursor:pointer;border:3px solid var(--paper);box-shadow:0 0 0 1px var(--ink);}
.range-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;}
.disclaimer{border-left:2px solid var(--accent);padding:12px 16px;font-size:13px;color:var(--muted);
  line-height:1.6;margin:24px 0;background:var(--paper2);}
.consent-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px;cursor:pointer;}
.consent-row input{width:18px;height:18px;margin-top:2px;accent-color:var(--ink);}
.consent-row span{font-size:14px;color:var(--muted);line-height:1.5;}
.navbar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,var(--paper) 40%);
  padding:40px 28px 28px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;}
.navbar-inner{width:100%;max-width:620px;display:flex;justify-content:space-between;align-items:center;gap:16px;}
.err-msg{font-size:13px;color:var(--err);min-height:18px;}
.btn-primary{background:var(--ink);color:var(--paper);border:none;padding:16px 32px;font-size:15px;
  font-weight:500;cursor:pointer;border-radius:2px;transition:opacity .2s,transform .15s;letter-spacing:.01em;}
.btn-primary{min-width:180px;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none;transform:translateZ(0);}
@media (hover:hover){.btn-primary:hover{opacity:.85;}}
.btn-primary:active{opacity:.85;}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;}
.btn-ghost{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.step{transition:opacity .35s ease, transform .35s ease;}
.step.enter{opacity:0;transform:translateY(14px);}
.step.leave{opacity:0;transform:translateY(-10px);}
@media (prefers-reduced-motion:reduce){
  .step{transition:none!important;} .progress-fill{transition:none!important;}
}
@media (max-width:560px){
  .grid-select{grid-template-columns:1fr;} .two-col{grid-template-columns:1fr;}
  .topbar{padding:20px 20px 0;} .stage{padding:28px 20px 150px;}
}
.journey{display:flex;justify-content:space-between;margin:44px 0;overflow-x:auto;gap:4px;}
.journey .jstep{flex:1;text-align:center;min-width:60px;}
.journey .jdot{width:8px;height:8px;border-radius:50%;background:var(--line);margin:0 auto 10px;}
.journey .jstep.active .jdot{background:var(--accent);}
.journey .jlabel{font-size:11px;letter-spacing:.04em;color:var(--muted);}
.journey .jstep.active .jlabel{color:var(--ink);}
.complete-cta{display:flex;flex-direction:column;gap:14px;margin-top:36px;align-items:flex-start;}
.wordmark{font-family:var(--serif);font-size:15px;letter-spacing:.02em;}
</style>
</head>
<body>
<div class="app">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="topbar">
    <button class="back-btn" id="backBtn" aria-label="Go back">← Back</button>
    <div class="wordmark">VITALIS</div>
    <div class="step-count" id="stepCount"></div>
  </div>
  <div class="stage" id="stage" tabindex="-1">
    <div class="stage-inner"><div class="step" id="stepContainer"></div></div>
  </div>
  <div class="navbar">
    <div class="navbar-inner">
      <div class="err-msg" id="errMsg"></div>
      <button class="btn-primary" id="nextBtn">Continue</button>
    </div>
  </div>
</div>

<script>
/* ---------- state ---------- */
const answers = {};
let idx = 0;

/* ---------- helpers to build fields ---------- */
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }

function singleSelect(key, options, cols=2){
  const wrap = el('div', 'grid-select'+(cols===1?' single-col':''));
  options.forEach(opt=>{
    const t = el('button','tile', `${opt.label}<span class="tick">✓</span>`);
    t.type='button';
    if(answers[key]===opt.value) t.classList.add('selected');
    t.onclick=()=>{ answers[key]=opt.value; renderStep(false); };
    wrap.appendChild(t);
  });
  return wrap;
}
function multiSelect(key, options, cols=2){
  if(!answers[key]) answers[key]=[];
  const wrap = el('div','grid-select'+(cols===1?' single-col':''));
  options.forEach(opt=>{
    const active = answers[key].includes(opt.value);
    const t = el('button','tile'+(active?' selected':''), `${opt.label}<span class="tick">✓</span>`);
    t.type='button';
    t.onclick=()=>{
      const i = answers[key].indexOf(opt.value);
      if(i>-1) answers[key].splice(i,1); else answers[key].push(opt.value);
      renderStep(false);
    };
    wrap.appendChild(t);
  });
  return wrap;
}
function yesNo(key){
  const wrap = el('div','yn-row');
  ['Yes','No'].forEach(v=>{
    const t = el('button','tile'+(answers[key]===v?' selected':''), v);
    t.type='button';
    t.onclick=()=>{ answers[key]=v; renderStep(false); };
    wrap.appendChild(t);
  });
  return wrap;
}
function textField(key, placeholder, type='text'){
  const i = document.createElement(type==='textarea'?'textarea':'input');
  if(type!=='textarea') i.type=type;
  i.placeholder=placeholder||'';
  i.value=answers[key]||'';
  i.oninput=()=>{ answers[key]=i.value; };
  return i;
}
function ratingGroup(items, key){
  if(!answers[key]) answers[key]={};
  const wrap = el('div','rating-group');
  const labels=['Poor','Fair','Good','Very good','Excellent'];
  items.forEach(item=>{
    const row = el('div','rating-item');
    const val = answers[key][item] || 0;
    const labelRow = el('div','rlabel', `<span>${item}</span><span class="rval">${val?labels[val-1]:''}</span>`);
    row.appendChild(labelRow);
    const dots = el('div','dots');
    for(let n=1;n<=5;n++){
      const d = el('button','dot'+(n<=val?' on':''));
      d.type='button'; d.setAttribute('aria-label', `${item}: ${labels[n-1]}`);
      d.onclick=()=>{ answers[key][item]=n; renderStep(false); };
      dots.appendChild(d);
    }
    row.appendChild(dots);
    wrap.appendChild(row);
  });
  return wrap;
}
function slider(key, min, max, step, unit, defaultVal, labels){
  if(answers[key]===undefined) answers[key]=defaultVal;
  const wrap = el('div','slider-wrap');
  const valDisp = el('div','slider-value', `${answers[key]}<span class="unit">${unit}</span>`);
  wrap.appendChild(valDisp);
  const input = document.createElement('input');
  input.type='range'; input.min=min; input.max=max; input.step=step; input.value=answers[key];
  input.oninput=()=>{ answers[key]=Number(input.value); valDisp.innerHTML=`${answers[key]}<span class="unit">${unit}</span>`; };
  wrap.appendChild(input);
  if(labels){ wrap.appendChild(el('div','range-labels', `<span>${labels[0]}</span><span>${labels[1]}</span>`)); }
  return wrap;
}

/* ---------- questionnaire data ---------- */
const STEPS = [
{ id:'intro', render(c){
    c.appendChild(el('div','q-eyebrow','Before your assessment'));
    c.appendChild(el('div','q-title','Before we measure anything, we want to understand you.'));
    c.appendChild(el('div','q-sub','Your answers give the Vitalis clinical team an initial picture of who you are and what you want — so your first in-person assessment starts from context, not a blank page. It takes about eight minutes.'));
  }, cta:'Begin Assessment' },

{ id:'name', title:'What should we call you?', render(c){
    const row = el('div','two-col');
    const f1=el('div','field-row'); f1.appendChild(el('label','field-label','First name')); f1.appendChild(textField('firstName','First name'));
    const f2=el('div','field-row'); f2.appendChild(el('label','field-label','Last name')); f2.appendChild(textField('lastName','Last name'));
    row.appendChild(f1); row.appendChild(f2); c.appendChild(row);
  }, validate:()=> answers.firstName && answers.lastName ? null : 'Please enter your first and last name.' },

{ id:'about', title:'A little about you.', sub:'This helps us calibrate your baseline, not fill out a chart.', render(c){
    const row = el('div','two-col');
    const f1=el('div','field-row'); f1.appendChild(el('label','field-label','Date of birth')); f1.appendChild(textField('dob',null,'date'));
    const f2=el('div','field-row'); f2.appendChild(el('label','field-label','Occupation')); f2.appendChild(textField('occupation','e.g. Consultant'));
    row.appendChild(f1); row.appendChild(f2); c.appendChild(row);
    c.appendChild(el('label','field-label','Sex'));
    c.appendChild(singleSelect('sex',[{label:'Male',value:'male'},{label:'Female',value:'female'}]));
  }, validate:()=> answers.dob && answers.sex ? null : 'Please complete date of birth and sex.' },

{ id:'activity', title:'How would you describe your current activity level?', render(c){
    c.appendChild(singleSelect('activityLevel',[
      {label:'Largely sedentary',value:'sedentary'},{label:'Lightly active',value:'light'},
      {label:'Moderately active',value:'moderate'},{label:'Highly active',value:'high'},
      {label:'Competitive athlete',value:'athlete'}
    ],1));
  }, validate:()=> answers.activityLevel ? null : 'Select one option to continue.' },

{ id:'objectives', title:'What brings you to Vitalis?', sub:'Select everything that applies.', render(c){
    c.appendChild(multiSelect('objectives',[
      {label:'Improve overall health',value:'health'},{label:'Increase strength',value:'strength'},
      {label:'Build muscle',value:'muscle'},{label:'Lose body fat',value:'fatloss'},
      {label:'Improve cardiovascular fitness',value:'cardio'},{label:'Increase energy',value:'energy'},
      {label:'Improve sleep',value:'sleep'},{label:'Improve recovery',value:'recovery'},
      {label:'Reduce pain or injury',value:'pain'},{label:'Improve mobility',value:'mobility'},
      {label:'Improve athletic performance',value:'athletic'},{label:'Healthy ageing / longevity',value:'longevity'},
      {label:'Understand my health data',value:'data'},{label:'Prevent future health problems',value:'prevent'}
    ]));
  }, validate:()=> answers.objectives && answers.objectives.length ? null : 'Select at least one objective.' },

{ id:'oneThing', title:"If Vitalis could help you make one major improvement in the next 12 months, what would it be?", optional:true, render(c){
    c.appendChild(textField('oneThing','Your answer','textarea'));
  }},

{ id:'healthRatings', title:'How would you rate the following, today?', sub:'Poor to excellent — an honest baseline, not a test.', render(c){
    c.appendChild(ratingGroup(['Energy','Sleep','Stress','Fitness','Strength','Mobility','Nutrition'],'healthRatings'));
  }, validate:()=> Object.keys(answers.healthRatings||{}).length>=7 ? null : 'Rate each area to continue.' },

{ id:'trainingFreq', title:'How often do you currently train?', render(c){
    c.appendChild(singleSelect('trainingFreq',[
      {label:'Not currently',value:'none'},{label:'1–2 sessions / week',value:'1-2'},
      {label:'3–4 sessions / week',value:'3-4'},{label:'5–6 sessions / week',value:'5-6'},
      {label:'Daily',value:'daily'}
    ],1));
  }, validate:()=> answers.trainingFreq ? null : 'Select one option.' },

{ id:'trainingTypes', title:'Which forms of exercise do you currently do?', render(c){
    c.appendChild(multiSelect('trainingTypes',[
      {label:'Resistance / weight training',value:'resistance'},{label:'Cardiovascular / endurance',value:'cardio'},
      {label:'Mobility / flexibility',value:'mobility'},{label:'Team or field sport',value:'sport'},
      {label:'Yoga / pilates',value:'yoga'},{label:'None currently',value:'none'}
    ]));
  }},

{ id:'movement', title:'Outside of structured training, how much do you move day to day?', render(c){
    c.appendChild(singleSelect('dailyMovement',[
      {label:'Mostly seated',value:'seated'},{label:'On my feet occasionally',value:'occasional'},
      {label:'On my feet most of the day',value:'mostly'},{label:'Physically demanding day',value:'demanding'}
    ],1));
  }, validate:()=> answers.dailyMovement ? null : 'Select one option.' },

{ id:'injury', title:'Are you currently managing any pain, injury or physical restriction?', render(c){
    c.appendChild(yesNo('hasInjury'));
    if(answers.hasInjury==='Yes'){
      const d = el('div','field-row'); d.style.marginTop='28px';
      d.appendChild(el('label','field-label','Where are you currently experiencing pain or restriction?'));
      d.appendChild(textField('injuryDetail','e.g. Lower back, right knee','textarea'));
      c.appendChild(d);
    }
  }, validate:()=> answers.hasInjury ? null : 'Please select yes or no.' },

{ id:'nutritionApproach', title:'How would you describe your current approach to eating?', render(c){
    c.appendChild(singleSelect('nutritionApproach',[
      {label:'No particular structure',value:'none'},{label:'Generally mindful',value:'mindful'},
      {label:'Actively tracking intake',value:'tracking'},{label:'Following a specific protocol',value:'protocol'}
    ],1));
  }, validate:()=> answers.nutritionApproach ? null : 'Select one option.' },

{ id:'nutritionRatings', title:'A quick read on your nutrition habits.', render(c){
    c.appendChild(ratingGroup(['Protein intake','Fruit & vegetable intake','Hydration'],'nutritionRatings'));
    const row=el('div','field-row'); row.style.marginTop='10px';
    row.appendChild(el('label','field-label','Alcohol — typical drinks per week'));
    row.appendChild(textField('alcohol','e.g. 2','number'));
    c.appendChild(row);
  }, validate:()=> Object.keys(answers.nutritionRatings||{}).length>=3 ? null : 'Rate each area to continue.' },

{ id:'nutritionRestrictions', title:'Any dietary restrictions, intolerances or allergies?', optional:true, render(c){
    c.appendChild(multiSelect('dietaryRestrictions',[
      {label:'Vegetarian',value:'veg'},{label:'Vegan',value:'vegan'},{label:'Gluten-free',value:'gf'},
      {label:'Dairy-free',value:'df'},{label:'FODMAP-sensitive',value:'fodmap'},{label:'None',value:'none'}
    ]));
    const row=el('div','field-row'); row.style.marginTop='20px';
    row.appendChild(el('label','field-label','Anything else we should know'));
    row.appendChild(textField('restrictionDetail','Optional','textarea'));
    c.appendChild(row);
  }},

{ id:'supplements', title:'Do you currently take any supplements?', render(c){
    c.appendChild(yesNo('takesSupplements'));
    if(answers.takesSupplements==='Yes'){
      const d=el('div','field-row'); d.style.marginTop='28px';
      d.appendChild(el('label','field-label','Which supplements?'));
      d.appendChild(textField('supplementDetail','e.g. Vitamin D, magnesium','textarea'));
      c.appendChild(d);
    }
  }, validate:()=> answers.takesSupplements ? null : 'Please select yes or no.'},

{ id:'sleepDuration', title:'On an average night, how many hours do you sleep?', render(c){
    c.appendChild(slider('sleepHours',3,10,0.5,'hrs',7,['3 hrs','10+ hrs']));
  }},

{ id:'sleepQuality', title:'And how well are you sleeping?', render(c){
    c.appendChild(ratingGroup(['Sleep quality','Ease falling asleep','Uninterrupted sleep','Morning energy','Stress level','Post-exercise recovery'],'sleepRatings'));
  }, validate:()=> Object.keys(answers.sleepRatings||{}).length>=6 ? null : 'Rate each area to continue.'},

{ id:'wearables', title:'Do you currently use a wearable device?', render(c){
    c.appendChild(multiSelect('wearables',[
      {label:'Apple Watch',value:'apple'},{label:'Garmin',value:'garmin'},{label:'WHOOP',value:'whoop'},
      {label:'Oura',value:'oura'},{label:'Fitbit',value:'fitbit'},{label:'Other',value:'other'},{label:'None',value:'none'}
    ]));
  }},

{ id:'medical', title:'Medical context.', sub:'This onboarding does not diagnose or replace clinical assessment — it simply prepares your care team.', render(c){
    c.appendChild(el('div','disclaimer','Information provided here is confidential and reviewed only by your Vitalis clinical team as part of preparing for your initial consultation. It is not a substitute for medical advice, diagnosis or treatment.'));
    const f1=el('div','field-row'); f1.appendChild(el('label','field-label','Known medical conditions')); f1.appendChild(textField('conditions','e.g. None, or list conditions','textarea')); c.appendChild(f1);
    const f2=el('div','field-row'); f2.appendChild(el('label','field-label','Current medications')); f2.appendChild(textField('medications','e.g. None, or list medications','textarea')); c.appendChild(f2);
  }},

{ id:'medicalHistory', title:'A little more history.', optional:true, render(c){
    const f1=el('div','field-row'); f1.appendChild(el('label','field-label','Previous surgeries')); f1.appendChild(textField('surgeries','Optional','textarea')); c.appendChild(f1);
    const f2=el('div','field-row'); f2.appendChild(el('label','field-label','Recent blood tests or imaging')); f2.appendChild(textField('recentTests','Optional','textarea')); c.appendChild(f2);
    const f3=el('div','field-row'); f3.appendChild(el('label','field-label','Family history — cardiovascular / metabolic')); f3.appendChild(textField('familyHistory','Optional','textarea')); c.appendChild(f3);
  }},

{ id:'motivation', title:"What matters most to you, right now?", render(c){
    c.appendChild(singleSelect('motivation',[
      {label:'Performing at my best',value:'perform'},{label:'Feeling better day to day',value:'feel'},
      {label:'Looking better',value:'look'},{label:'Living longer and healthier',value:'longevity'},
      {label:'Understanding what\u2019s happening inside my body',value:'understand'},
      {label:'Recovering from injury',value:'recover'},{label:'Preventing future health problems',value:'prevent'}
    ],1));
  }, validate:()=> answers.motivation ? null : 'Select one option.'},

{ id:'future', title:'How do you want to feel, 12 months from now?', optional:true, render(c){
    c.appendChild(textField('futureFeel','Your answer','textarea'));
  }},

{ id:'commitment', title:'How ready are you to make meaningful changes to your health?', render(c){
    c.appendChild(slider('readiness',1,10,1,'/ 10',7,['Not ready','Fully committed']));
  }},

{ id:'timeCommit', title:'How much time can you realistically commit each week?', render(c){
    c.appendChild(singleSelect('timeCommitment',[
      {label:'Under 2 hours',value:'<2'},{label:'2–4 hours',value:'2-4'},
      {label:'4–7 hours',value:'4-7'},{label:'7+ hours',value:'7+'}
    ],1));
  }, validate:()=> answers.timeCommitment ? null : 'Select one option.'},

{ id:'contact', title:'Where should we reach you?', render(c){
    const f1=el('div','field-row'); f1.appendChild(el('label','field-label','Email')); f1.appendChild(textField('email','you@email.com','email')); c.appendChild(f1);
    const f2=el('div','field-row'); f2.appendChild(el('label','field-label','Phone')); f2.appendChild(textField('phone','04xx xxx xxx','tel')); c.appendChild(f2);
    c.appendChild(el('label','field-label','Preferred contact method'));
    c.appendChild(singleSelect('preferredContact',[{label:'Phone',value:'phone'},{label:'Email',value:'email'}],2));
    const cw = el('label','consent-row');
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=!!answers.consent;
    cb.onchange=()=>{ answers.consent = cb.checked; };
    cw.appendChild(cb);
    cw.appendChild(el('span',null,'I consent to Vitalis storing and using this information to prepare my initial assessment, in line with the Vitalis privacy policy. <em>[Placeholder — final wording pending legal/privacy review.]</em>'));
    c.appendChild(cw);
  }, validate:()=>{
      if(!answers.email || !answers.phone || !answers.preferredContact) return 'Please complete your contact details.';
      if(!answers.consent) return 'Please acknowledge consent to continue.';
      return null;
  }},

{ id:'complete', isComplete:true, render(c){
    c.appendChild(el('div','q-eyebrow','Your baseline starts here'));
    c.appendChild(el('div','q-title', `Thank you, ${answers.firstName||''}.`));
    c.appendChild(el('div','q-sub','Your responses give the Vitalis team an initial picture of where you are today and where you want to go. The next stage is your comprehensive assessment, where this information is combined with objective testing — DEXA, bloodwork, HRV and movement data — to build your personal blueprint.'));
    const j = el('div','journey');
    ['You','Measure','Analyse','Protocol','Optimise'].forEach((label,i)=>{
      const s = el('div','jstep'+(i===0?' active':''));
      s.appendChild(el('div','jdot')); s.appendChild(el('div','jlabel',label));
      j.appendChild(s);
    });
    c.appendChild(j);
    const ctas = el('div','complete-cta');
    const primary = el('button','btn-primary','Book Your Assessment');
    primary.onclick=()=> submitToVitalisCRM();
    const secondary = el('button','btn-ghost','Return to Vitalis');
    ctas.appendChild(primary); ctas.appendChild(secondary);
    c.appendChild(ctas);
  }}
];

/* ---------- engine ---------- */
function visibleSteps(){ return STEPS; } // all steps currently unconditional at list-level; conditional fields render inline
function totalCount(){ return STEPS.length; }

function renderStep(animate=true){
  const stageEl = document.getElementById('stage');
  const keepScroll = stageEl.scrollTop;
  const step = STEPS[idx];
  const container = document.getElementById('stepContainer');
  const draw = ()=>{
    container.innerHTML='';
    if(step.title) container.appendChild(el('div','q-title'+(step.optional&&!step.sub?' has-optional':''),step.title));
    if(step.sub) container.appendChild(el('div','q-sub',step.sub));
    if(step.optional) container.appendChild(el('div','q-optional','Optional'));
    step.render(container);
    document.getElementById('errMsg').textContent='';
  };
  if(animate){
    container.classList.add('leave');
    setTimeout(()=>{ draw(); container.classList.remove('leave'); container.classList.add('enter');
      requestAnimationFrame(()=>container.classList.remove('enter')); }, 180);
  } else { draw(); stageEl.scrollTop = keepScroll; }

  document.getElementById('backBtn').classList.toggle('hidden', idx===0);
  document.getElementById('stepCount').textContent = step.isComplete ? '' : `${String(idx+1).padStart(2,'0')} / ${String(totalCount()-1).padStart(2,'0')}`;
  document.getElementById('progressFill').style.width = `${(idx/(totalCount()-1))*100}%`;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = step.isComplete ? 'none' : 'block';
  const nextLabel = step.cta || (idx===totalCount()-2 ? 'Complete Assessment' : 'Continue');
  nextBtn.replaceChildren(document.createTextNode(nextLabel));
  if(animate) stageEl.scrollTop = 0;
}

document.getElementById('nextBtn').onclick=()=>{
  document.getElementById('nextBtn').blur();
  const step = STEPS[idx];
  if(step.validate){
    const err = step.validate();
    if(err){ document.getElementById('errMsg').textContent = err; return; }
  }
  if(idx < STEPS.length-1){ idx++; renderStep(true); }
};
document.getElementById('backBtn').onclick=()=>{
  if(idx>0){ idx--; renderStep(true); }
};
document.addEventListener('keydown', e=>{
  const tag = document.activeElement.tagName;
  if(e.key==='Enter' && tag!=='TEXTAREA'){ document.getElementById('nextBtn').click(); }
});

renderStep(false);
</script>
